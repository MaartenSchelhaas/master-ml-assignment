[project]
name = "ml-assignment"
version = "0.1.0"
description = "FEM21045 Machine Learning in Econometrics assignment: default prediction with hand-rolled neural networks"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_assignment"]